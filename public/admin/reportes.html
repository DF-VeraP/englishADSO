<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEAKSOFT | Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .reports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .report-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
        .report-kpi .kpi-val { font-size: 2rem; font-weight: 800; color: #22d3ee; }
        .report-kpi .kpi-label { font-size: .8rem; color: var(--text-muted); margin-top: .25rem; text-transform: uppercase; letter-spacing: .05em; }
        .report-kpi .kpi-sub { font-size: .75rem; color: #10b981; margin-top: .2rem; font-weight: 600; }
        .report-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .report-section h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
        .role-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .75rem; border-radius: 20px; font-size: .75rem; font-weight: 700; }
        .role-pill.admin { background: rgba(239,68,68,.15); color: #f87171; }
        .role-pill.instructor { background: rgba(245,158,11,.15); color: #fcd34d; }
        .role-pill.aprendiz { background: rgba(16,185,129,.15); color: #6ee7b7; }
        .bar-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .65rem; }
        .bar-label { width: 160px; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#1a56db,#0891b2); transition: width .6s; }
        .bar-pct { font-size: .78rem; color: var(--text-muted); width: 36px; text-align: right; flex-shrink: 0; }
        .log-row { display: flex; align-items: flex-start; gap: .75rem; padding: .65rem 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
        .log-row:last-child { border-bottom: none; }
        .log-badge { padding: .2rem .55rem; border-radius: 6px; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
        .log-badge.LOGIN    { background: rgba(26,86,219,.2); color: #60a5fa; }
        .log-badge.CREATE   { background: rgba(16,185,129,.2); color: #6ee7b7; }
        .log-badge.UPDATE   { background: rgba(245,158,11,.2); color: #fcd34d; }
        .log-badge.DELETE   { background: rgba(239,68,68,.2);  color: #f87171; }
        .donut-wrap { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .donut-legend { display: flex; flex-direction: column; gap: .5rem; }
        .legend-item { display: flex; align-items: center; gap: .5rem; font-size: .82rem; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body data-theme-default="dark">
<div class="bg-glow"></div>

<header class="app-header">
    <div class="header-left">
        <a href="/index.html" class="app-logo"><span>SPEAKSOFT</span></a>
        <nav class="header-nav">
            <a href="/index.html" class="nav-item">Dashboard</a>
            <a href="/admin/usuarios.html" class="nav-item">Usuarios</a>
            <a href="/admin/cursos.html" class="nav-item">Cursos</a>
            <a href="/admin/fichas.html" class="nav-item">Fichas</a>
            <a href="/admin/reportes.html" class="nav-item active">Reportes</a>
        </nav>
    </div>
    <div class="header-right">
        <a href="/profile.html" class="user-pill" style="text-decoration:none">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="user-name">Cargando...</div>
                <span class="role-badge" id="role-badge"></span>
            </div>
        </a>
        <button class="btn-logout" id="btn-logout">
            <i class="bi bi-box-arrow-right" style="font-size:15px"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>
</header>

<main class="app-main">
    <div class="welcome-banner">
        <div class="welcome-text">
            <h1>Reportes de la Plataforma</h1>
            <p>Estadísticas generales, actividad y rendimiento</p>
        </div>
        <button id="btn-export" style="padding:.65rem 1.25rem;border-radius:10px;background:rgba(26,86,219,.2);border:1px solid rgba(26,86,219,.35);color:#60a5fa;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.5rem">
            <i class="bi bi-download" style="font-size:15px"></i>
            Exportar CSV
        </button>
    </div>

    <div id="reports-content">
        <div style="text-align:center;padding:3rem;color:var(--text-muted)">Cargando reportes...</div>
    </div>
</main>

<script src="../js/AuthService.js"></script>
<script src="../js/AuthGuard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const payload = AuthGuard.requireAuth(['admin']);
    if (!payload) return;
    const auth  = new AuthService();
    const user  = AuthGuard.getUser() || {};
    const nombre = user.nombre || payload.nombre || payload.email;
    document.getElementById('user-avatar').textContent = nombre.slice(0,2).toUpperCase();
    document.getElementById('user-name').textContent   = nombre;
    document.getElementById('role-badge').textContent  = user.rol || payload.rol;
    document.getElementById('btn-logout').addEventListener('click', () => AuthGuard.logout());

    try {
        const res  = await auth.apiFetch('/api/reports/admin');
        const data = await res.json();
        renderReport(data);
        document.getElementById('btn-export').addEventListener('click', () => exportCSV(data));
    } catch {
        document.getElementById('reports-content').innerHTML =
            '<div style="text-align:center;padding:3rem;color:#f87171">Error al cargar los reportes.</div>';
    }
});

function renderReport(data) {
    const r = data.resumen;
    const colors = ['#60a5fa','#34d399','#fcd34d'];
    const roleColors = { admin: '#f87171', instructor: '#fcd34d', aprendiz: '#6ee7b7' };

    document.getElementById('reports-content').innerHTML = `
        <!-- KPIs -->
        <div class="reports-grid">
            ${kpi(r.totalUsuarios,       'Total usuarios',       `${r.usuariosActivos} activos`)}
            ${kpi(r.totalCursos,         'Cursos activos',       `${r.totalModulos} módulos`)}
            ${kpi(r.totalInscripciones,  'Inscripciones',        `${r.inscripcionesActivas} activas`)}
            ${kpi(r.promedioProgreso+'%','Progreso promedio',    '')}
            ${kpi(r.tasaCompletitud+'%', 'Tasa de completitud',  `${r.inscripcionesCompletas} completadas`)}
        </div>

        <!-- Distribución de roles -->
        <div class="report-section">
            <h3>Distribución de roles</h3>
            <div class="donut-wrap">
                <div class="donut-legend">
                    ${data.distribucionRoles.map(r => `
                    <div class="legend-item">
                        <div class="legend-dot" style="background:${roleColors[r.rol]||'#60a5fa'}"></div>
                        <span class="role-pill ${r.rol}">${r.rol}</span>
                        <span style="font-weight:700">${r.total}</span>
                    </div>`).join('')}
                </div>
            </div>
        </div>

        <!-- Top cursos -->
        <div class="report-section">
            <h3>Top cursos por inscripciones</h3>
            ${data.topCursos.map((c, i) => `
            <div class="bar-row">
                <div class="bar-label" title="${c.titulo}">${i+1}. ${c.titulo}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${Math.min(c.inscripciones*10,100)}%"></div>
                </div>
                <div class="bar-pct">${c.inscripciones}</div>
                <div style="font-size:.75rem;color:#22d3ee;width:50px;text-align:right;flex-shrink:0">${c.promedioProgreso}% prog.</div>
            </div>`).join('')}
        </div>

        <!-- Actividad reciente -->
        <div class="report-section">
            <h3>Actividad reciente del sistema</h3>
            ${data.actividadReciente.map(a => `
            <div class="log-row">
                <span class="log-badge ${a.accion}">${a.accion}</span>
                <div style="flex:1;min-width:0">
                    <div style="font-weight:600">${a.usuario} <span style="color:var(--text-muted);font-weight:400">en ${a.recurso}</span></div>
                    ${a.detalle ? `<div style="color:var(--text-muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.detalle}</div>` : ''}
                </div>
                <div style="color:var(--text-muted);font-size:.75rem;white-space:nowrap;flex-shrink:0">${new Date(a.fecha).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'})}</div>
            </div>`).join('')}
        </div>`;
}

function kpi(val, label, sub) {
    return `<div class="report-kpi">
        <div class="kpi-val">${val}</div>
        <div class="kpi-label">${label}</div>
        ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    </div>`;
}

function exportCSV(data) {
    const rows = [['Métrica','Valor']];
    const r = data.resumen;
    rows.push(
        ['Total usuarios', r.totalUsuarios],
        ['Usuarios activos', r.usuariosActivos],
        ['Cursos activos', r.totalCursos],
        ['Inscripciones totales', r.totalInscripciones],
        ['Progreso promedio', r.promedioProgreso + '%'],
        ['Tasa de completitud', r.tasaCompletitud + '%'],
    );
    const csv = rows.map(r => r.join(',')).join('\n');
    const a   = document.createElement('a');
    a.href    = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = `reporte_speaksoft_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}
</script>
</body>
</html>
